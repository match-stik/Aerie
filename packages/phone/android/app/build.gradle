apply plugin: 'com.android.application'

android {
    namespace "com.aerie.phone"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aerie.phone"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30
        versionName "1.29"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing loads from outside the repo tree (house BYOK rule —
    // no key material in repo files, gitignored or otherwise). Falls back
    // to debug signing when the keystore is absent.
    def keystorePropsFile = file("${System.properties['user.home']}/.aerie-android/keystore.properties")
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.all {
    resolutionStrategy {
        // The Browser plugin pulls androidx.browser 1.9.0, which demands
        // compileSdk 36 and Android Gradle plugin 8.9.1+. This project is on
        // AGP 8.7.2 / compileSdk 35, and bumping the whole toolchain to land
        // one plugin is a much larger change than the feature is worth. 1.8.0
        // is the last release that builds here and carries the Custom Tabs API
        // @capacitor/browser actually uses. Revisit when the toolchain moves.
        force 'androidx.browser:browser:1.8.0'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Spotify's App Remote kit (Apache-2.0, github.com/spotify/android-sdk v0.8.0),
    // which wakes Spotify on the phone, and the gson it reads JSON with.
    implementation files('libs/spotify-app-remote-release-0.8.0.aar')
    implementation 'com.google.code.gson:gson:2.8.6'
    // The app's own push listener (AerieMessagingService) extends the push
    // plugin's and reads RemoteMessage, which the plugin keeps to itself; this
    // is the plugin's own version, so nothing else moves.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
