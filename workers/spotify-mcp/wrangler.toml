# Spotify MCP worker. Only needed if you deploy with the wrangler CLI; the
# dashboard works too. Live as spotify-mcp; the KV id and secrets are set there.
#
#   1. wrangler kv namespace create SPOTIFY_KV, paste its id below
#   2. wrangler secret put SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET /
#      SPOTIFY_REDIRECT_URI / SPOTIFY_REFRESH_TOKEN
#   3. wrangler deploy

name = "spotify-mcp"
main = "index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "SPOTIFY_KV"
id = "<your SPOTIFY_KV namespace id>"
