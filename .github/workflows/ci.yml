# Build and test every push and pull request. The tests never start Claude
# Code or Codex and never reach a model; they need no secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # Pinned by commit, not tag: a tag can be moved to other code, a commit
      # cannot (third kit audit, Nov 17 2026). To update, take the new tag's commit
      # and keep its version in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
